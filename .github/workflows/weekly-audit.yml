name: Weekly Security Audit

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔎 Run npm audit (moderate+)
        run: npm audit --audit-level=moderate || true

      - name: 🧹 Run ESLint check
        run: npx eslint . || true

      - name: 🧱 Run TypeScript type check
        run: npx tsc --noEmit || true

      - name: 🧪 Run Trivy vulnerability scan
        run: npx trivy fs . || true

      - name: 📝 Create PR with results
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Weekly Security Report – $(date +'%Y-%m-%d')"
          branch: "weekly-report-$(date +'%Y-%m-%d')"
          base: 'main'
          commit-message: 'chore: weekly security audit'
          body: |
            ### 🧠 Weekly Security Report
            **Date:** $(date +'%Y-%m-%d')
            **Checks:**
            - npm audit (moderate+)
            - ESLint static analysis
            - TypeScript compilation
            - Trivy filesystem scan
            ---
            ✅ Auto-generated by GitHub Actions
          token: ${{ secrets.CRON_SECRET }}
