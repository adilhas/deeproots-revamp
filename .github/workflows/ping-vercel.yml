name: Ping Reminder API Every 10 Minutes

on:
  schedule:
    - cron: '*/01 * * * *'
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}

    steps:
      - name: Ping Reminder Endpoint
         run: |
          echo "Triggering deal room cron at $(date)"
          echo "Using NEXTAUTH_URL: ${NEXTAUTH_URL}"
          response=$(curl -s -o /dev/null -w "%{http_code}" "${NEXTAUTH_URL}/api/seed/check-reminders")
          echo "Reminder API responded with status: $response"
          if [[ "$response" -ne 200 ]]; then
            echo "❌ API call failed with status $response"
            exit 1
           fi
